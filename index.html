<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deye Inverter Screen Simulator</title>
    <style>
        :root {
            --deye-blue: #0284c7;
            --deye-bg: #0b132b;
            --lcd-bg: #061826;
            --lcd-text: #00ffcc;
            --btn-bg: #1c2541;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--deye-bg);
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .control-panel {
            background: #1c2541;
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            border: 1px solid #3a506b;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .control-panel label {
            font-weight: bold;
            color: #5bc0be;
        }

        .control-panel select {
            padding: 8px 15px;
            border-radius: 6px;
            background: #0b132b;
            color: white;
            border: 1px solid #5bc0be;
            font-size: 16px;
            outline: none;
        }

        /* جسم الإنفرتر */
        .inverter-body {
            background: linear-gradient(145deg, #ffffff, #dcdcdc);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            width: 360px;
            text-align: center;
            border: 4px solid #b0b0b0;
        }

        .deye-logo {
            font-weight: 900;
            font-size: 28px;
            color: #0284c7;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .model-subtitle {
            font-size: 12px;
            color: #666;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* الشاشة الدائرية لإنفرتر Deye */
        .screen-bezel {
            background: #111;
            width: 280px;
            height: 280px;
            margin: 0 auto;
            border-radius: 50%;
            border: 8px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
            position: relative;
        }

        .lcd-display {
            background: var(--lcd-bg);
            width: 200px;
            height: 200px;
            border-radius: 12px;
            border: 2px solid #00ffcc;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: var(--lcd-text);
            font-family: 'Courier New', Courier, monospace;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
        }

        .lcd-header {
            font-size: 11px;
            border-bottom: 1px dashed #00ffcc;
            padding-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        .lcd-content {
            margin: 10px 0;
            text-align: center;
        }

        .param-title {
            font-size: 12px;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .param-value {
            font-size: 22px;
            font-weight: bold;
            color: #ffcc00;
            background: rgba(255, 204, 0, 0.1);
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #ffcc00;
        }

        .lcd-footer {
            font-size: 10px;
            display: flex;
            justify-content: space-between;
            color: #888;
        }

        /* لوحة الأزرار الأربعة على اليمين واليسار */
        .keypad-container {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            padding: 0 10px;
        }

        .btn-deye {
            background: #222;
            color: white;
            border: 2px solid #555;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #000;
            transition: all 0.1s;
            font-size: 12px;
        }

        .btn-deye:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #000;
        }

        .btn-up-down {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>

    <!-- خيار تحديد قدرة الإنفرتر -->
    <div class="control-panel">
        <label>حدد قدرة إنفرتر Deye:</label>
        <select id="kw-selector" onchange="changeInverterKW()">
            <option value="3.6">Deye 3.6 kW (Single Phase)</option>
            <option value="5" selected>Deye 5.0 kW (Single Phase)</option>
            <option value="8">Deye 8.0 kW (Single Phase)</option>
            <option value="12">Deye 12.0 kW (Three Phase)</option>
        </select>
    </div>

    <!-- واجهة الإنفرتر -->
    <div class="inverter-body">
        <div class="deye-logo">Deye</div>
        <div class="model-subtitle" id="display-model-name">SUN-5K-SG04LP1</div>

        <!-- الشاشة الدائرية -->
        <div class="screen-bezel">
            <div class="lcd-display">
                <div class="lcd-header">
                    <span id="lcd-mode">STATUS</span>
                    <span id="lcd-kw-tag">5.0kW</span>
                </div>

                <div class="lcd-content">
                    <div class="param-title" id="param-name">MAIN SCREEN</div>
                    <div class="param-value" id="param-val">230V / NORMAL</div>
                </div>

                <div class="lcd-footer">
                    <span>Li-BMS: OK</span>
                    <span id="page-num">1/5</span>
                </div>
            </div>
        </div>

        <!-- أزرار التحكم الحقيقية -->
        <div class="keypad-container">
            <button class="btn-deye" onclick="pressButton('ESC')">ESC</button>
            <div class="btn-up-down">
                <button class="btn-deye" onclick="pressButton('UP')">▲</button>
                <button class="btn-deye" onclick="pressButton('DOWN')">▼</button>
            </div>
            <button class="btn-deye" onclick="pressButton('ENTER')">ENTER</button>
        </div>
    </div>

<script>
    // بيانات ومواصفات البرامترات لإنفرتر Deye
    let currentKW = 5.0;
    let mode = 'MAIN'; // MAIN or MENU or EDIT
    let currentIndex = 0;

    let settings = [
        { title: "01. Max Sell Power", val: 5000, unit: "W", step: 500, max: 5000 },
        { title: "02. Max Charge Current", val: 100, unit: "A", step: 10, max: 120 },
        { title: "03. Max Discharge Current", val: 100, unit: "A", step: 10, max: 120 },
        { title: "04. Battery Type", val: "Lithium", options: ["Lithium", "Lead-Acid", "No-Batt"] },
        { title: "05. Lithium Protocol (BMS)", val: "00 (Pylon)", options: ["00 (Pylon)", "12 (Felicity)", "05 (Dyness)"] }
    ];

    function changeInverterKW() {
        currentKW = parseFloat(document.getElementById('kw-selector').value);
        
        // تعديل القيم القصوى حسب الكيلوواط المختار
        if (currentKW === 3.6) {
            document.getElementById('display-model-name').innerText = "SUN-3.6K-SG04LP1";
            settings[0].val = 3600; settings[0].max = 3600;
            settings[1].val = 70; settings[1].max = 90;
            settings[2].val = 70; settings[2].max = 90;
        } else if (currentKW === 5) {
            document.getElementById('display-model-name').innerText = "SUN-5K-SG04LP1";
            settings[0].val = 5000; settings[0].max = 5000;
            settings[1].val = 100; settings[1].max = 120;
            settings[2].val = 100; settings[2].max = 120;
        } else if (currentKW === 8) {
            document.getElementById('display-model-name').innerText = "SUN-8K-SG04LP1";
            settings[0].val = 8000; settings[0].max = 8000;
            settings[1].val = 150; settings[1].max = 190;
            settings[2].val = 150; settings[2].max = 190;
        } else if (currentKW === 12) {
            document.getElementById('display-model-name').innerText = "SUN-12K-SG04LP3 (3-Phase)";
            settings[0].val = 12000; settings[0].max = 12000;
            settings[1].val = 200; settings[1].max = 240;
            settings[2].val = 200; settings[2].max = 240;
        }

        document.getElementById('lcd-kw-tag').innerText = currentKW + "kW";
        updateDisplay();
    }

    function updateDisplay() {
        let item = settings[currentIndex];

        if (mode === 'MAIN') {
            document.getElementById('lcd-mode').innerText = "STATUS";
            document.getElementById('param-name').innerText = "GRID / SOLAR STATUS";
            document.getElementById('param-val').innerText = "230V / " + currentKW + "kW";
            document.getElementById('page-num').innerText = "--/--";
        } else if (mode === 'MENU' || mode === 'EDIT') {
            document.getElementById('lcd-mode').innerText = (mode === 'EDIT') ? "SETTING [EDIT]" : "MENU [SELECT]";
            document.getElementById('param-name').innerText = item.title;
            
            if (typeof item.val === 'number') {
                document.getElementById('param-val').innerText = item.val + " " + item.unit;
            } else {
                document.getElementById('param-val').innerText = item.val;
            }

            document.getElementById('page-num').innerText = (currentIndex + 1) + "/" + settings.length;
        }
    }

    function pressButton(btn) {
        let item = settings[currentIndex];

        if (btn === 'ENTER') {
            if (mode === 'MAIN') {
                mode = 'MENU';
            } else if (mode === 'MENU') {
                mode = 'EDIT';
            } else if (mode === 'EDIT') {
                mode = 'MENU'; // حفظ الخيار
            }
        } else if (btn === 'ESC') {
            if (mode === 'EDIT') {
                mode = 'MENU';
            } else if (mode === 'MENU') {
                mode = 'MAIN';
            }
        } else if (btn === 'UP') {
            if (mode === 'MENU') {
                currentIndex = (currentIndex > 0) ? currentIndex - 1 : settings.length - 1;
            } else if (mode === 'EDIT') {
                if (typeof item.val === 'number') {
                    if (item.val + item.step <= item.max) item.val += item.step;
                } else if (item.options) {
                    let optIndex = item.options.indexOf(item.val);
                    optIndex = (optIndex + 1) % item.options.length;
                    item.val = item.options[optIndex];
                }
            }
        } else if (btn === 'DOWN') {
            if (mode === 'MENU') {
                currentIndex = (currentIndex < settings.length - 1) ? currentIndex + 1 : 0;
            } else if (mode === 'EDIT') {
                if (typeof item.val === 'number') {
                    if (item.val - item.step >= 0) item.val -= item.step;
                } else if (item.options) {
                    let optIndex = item.options.indexOf(item.val);
                    optIndex = (optIndex - 1 + item.options.length) % item.options.length;
                    item.val = item.options[optIndex];
                }
            }
        }

        updateDisplay();
    }

    // التهيئة عند التحميل
    window.onload = changeInverterKW;
</script>

</body>
</html>
