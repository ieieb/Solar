<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة إعدادات الإنفرتر الذكية</title>
    <style>
        :root { --primary-color: #0f172a; --accent-color: #1e3a8a; --highlight-color: #d97706; --bg-color: #f8fafc; --border-color: #cbd5e1; }
        body { font-family: sans-serif; background-color: var(--bg-color); padding: 20px; }
        .container { max-width: 650px; margin: 0 auto; background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; }
        select, input { width: 100%; padding: 10px; border: 1px solid #94a3b8; border-radius: 8px; }
        .btn-calc { width: 100%; padding: 12px; background-color: var(--accent-color); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background-color: var(--primary-color); color: white; padding: 10px; text-align: right; }
        td { padding: 10px; border-bottom: 1px solid #e2e8f0; }
        .setting-val { font-weight: bold; color: var(--highlight-color); }
    </style>
</head>
<body>

<div class="container">
    <h2>حاسبة إعدادات الإنفرتر</h2>

    <div class="form-group">
        <label>قدرة الإنفرتر (kW):</label>
        <input type="number" id="kwInput" step="0.1" placeholder="مثال: 5">
    </div>

    <div class="form-group">
        <label>نوع البطارية:</label>
        <select id="batTypeSelect">
            <option value="tubular">سائلة (Tubular)</option>
            <option value="gel">جل / AGM (Gel)</option>
            <option value="lithium_manual">ليثيوم بدون اتصال (Manual Setup - USE)</option>
            <option value="lithium_bms">ليثيوم مع اتصال (BMS Communication)</option>
        </select>
    </div>

    <div class="form-group">
        <label>سعة البطارية (Ah):</label>
        <input type="number" id="batValueInput" placeholder="أدخل سعة البطارية">
    </div>

    <button class="btn-calc" onclick="calculate()">توليد الإعدادات</button>

    <div id="settingsResult"></div>
</div>

<script>
function calculate() {
    const kw = parseFloat(document.getElementById('kwInput').value);
    const ah = parseFloat(document.getElementById('batValueInput').value);
    const type = document.getElementById('batTypeSelect').value;

    let sysVolt = (kw <= 1.5) ? 12 : (kw <= 3.6 ? 24 : 48);

    let data = {
        01: "SOL / SBU",
        02: "", 05: "", 11: "10 A", 12: "", 13: "",
        26: "", 27: "", 29: ""
    };

    if (type === 'lithium_bms') {
        data[02] = "Auto (BMS)";
        data[05] = "LIB / PYL (حسب نوع البطارية)";
        data[11] = "Auto (BMS)";
        data[12] = (sysVolt === 48 ? "50.0 V" : (sysVolt === 24 ? "25.0 V" : "12.5 V"));
        data[13] = (sysVolt === 48 ? "53.6 V" : (sysVolt === 24 ? "26.8 V" : "13.3 V"));
        data[26] = "Auto (BMS)";
        data[27] = "Auto (BMS)";
        data[29] = "Auto (BMS)";
    } else {
        // منطق القيم اليدوية (Manual)
        let maxC = Math.round(ah * (type === 'lithium_manual' ? 0.3 : 0.15));
        data[02] = Math.min(maxC, 100) + " A";
        data[05] = "USE";
        
        if (sysVolt === 48) {
            data[26] = (type === 'lithium_manual' ? "56.8 V" : "57.6 V");
            data[27] = (type === 'lithium_manual' ? "54.0 V" : "54.4 V");
            data[29] = (type === 'lithium_manual' ? "48.0 V" : "43.0 V");
            data[12] = "46.0 V";
            data[13] = "53.0 V";
        }
        // يمكن إضافة منطق 12V و 24V بنفس الطريقة هنا
    }

    let html = `<table><tr><th>الرمز</th><th>الإعداد</th><th>القيمة</th></tr>`;
    for (let key in data) {
        html += `<tr><td>${key}</td><td>${getLabel(key)}</td><td class="setting-val">${data[key]}</td></tr>`;
    }
    html += `</table>`;
    document.getElementById('settingsResult').innerHTML = html;
}

function getLabel(key) {
    const labels = {01: "Priority", 02: "Max Charge", 05: "Battery Type", 11: "AC Charge", 12: "Back to Utility", 13: "Back to Battery", 26: "Bulk Volts", 27: "Float Volts", 29: "Cut-off"};
    return labels[key] || "إعداد";
}
</script>
</body>
</html>
