<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حاسبة التوافق وإعدادات الإنفرتر الذكية</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; direction: rtl; }
    .card { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { color: #1a2a3a; text-align: center; margin-top: 0; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; font-weight: bold; color: #333; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    button { width: 100%; background: #27ae60; color: white; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:hover { background: #219150; }
    #warning { margin-top: 15px; padding: 10px; border-radius: 6px; font-weight: bold; display: none; }
    #output { margin-top: 20px; background: #f8f9fa; padding: 15px; border-radius: 6px; border: 1px solid #ddd; white-space: pre-line; line-height: 1.6; }
  </style>
</head>
<body>

<div class="card">
  <h2>💻 المبرمج الذكي لإنفرترات الطاقة الشمسية</h2>
  
  <div class="form-group">
    <label>قدرة الألواح (System kW):</label>
    <input type="number" id="sysKw" placeholder="مثال: 6">
  </div>

  <div class="form-group">
    <label>قدرة الإنفرتر (Inverter kW):</label>
    <input type="number" id="invKw" placeholder="مثال: 5">
  </div>

  <div class="form-group">
    <label>ماركة الإنفرتر:</label>
    <select id="brand">
      <option value="voltronic">Voltronic (Axpert / Must)</option>
      <option value="deye">Deye / Sol-Ark</option>
      <option value="huawei">Huawei (SUN2000)</option>
      <option value="growatt">Growatt</option>
    </select>
  </div>

  <div class="form-group">
    <label>نوع البطارية:</label>
    <select id="battery">
      <option value="lithium">ليثيوم (Lithium-Ion / LiFePO4)</option>
      <option value="gel">جل (Gel Battery)</option>
      <option value="tubular">أنبوبية سائلة (Tubular Acid)</option>
    </select>
  </div>

  <button onclick="processProgramming()">🚀 استخراج كافة البرمجيات والإعدادات</button>

  <div id="warning"></div>
  <div id="output">أدخل البيانات واضغط على الزر لاستخراج الدليل...</div>
</div>

<script>
function processProgramming() {
  const sysKw = parseFloat(document.getElementById('sysKw').value);
  const invKw = parseFloat(document.getElementById('invKw').value);
  const brand = document.getElementById('brand').value;
  const battery = document.getElementById('battery').value;
  const warnDiv = document.getElementById('warning');
  const outDiv = document.getElementById('output');

  if (!sysKw || !invKw || sysKw <= 0 || invKw <= 0) {
    alert('الرجاء إدخال قيم صحيحة لحجم الألواح والإنفرتر');
    return;
  }

  // التحقق من نسبة التحميل الفوقي
  const ratio = sysKw / invKw;
  warnDiv.style.display = 'block';
  if (ratio > 1.30) {
    warnDiv.style.background = '#f8d7da';
    warnDiv.style.color = '#721c24';
    warnDiv.innerHTML = `⚠️ تحذير: حجم الألواح (${sysKw}kW) ضخم بالنسبة للإنفرتر (${invKw}kW). قد يحصل فقدان طاقة (Clipping).`;
  } else if (ratio < 0.5) {
    warnDiv.style.background = '#fff3cd';
    warnDiv.style.color = '#856404';
    warnDiv.innerHTML = '⚠️ تنبيه: كمية الألواح قليلة جداً مقارنة بقدرة الإنفرتر.';
  } else {
    warnDiv.style.background = '#d4edda';
    warnDiv.style.color = '#155724';
    warnDiv.innerHTML = '✅ التوافق ممتاز: حجم الألواح متناسق مع قدرة الإنفرتر.';
  }

  // إنشاء التعليمات حسب الماركة
  let steps = [];
  const maxAmp = Math.min(100, Math.round((sysKw * 1000) / 48));

  if (brand === 'voltronic') {
    steps = [
      "📍 [برنامج 01]: اضبط على SBU (طاقة شمسية ثم بطارية ثم شبكة).",
      `📍 [برنامج 02]: أقصى تيار شحن مقترح = ${maxAmp} أمبير.`,
      `📍 [برنامج 05]: نوع البطارية = ${battery === 'lithium' ? 'LI (ليثيوم مع BMS)' : 'USE (مخصص لضبط الفولتية)'}`,
      `📍 [برنامج 26]: Bulk Voltage = ${battery === 'lithium' ? '54.0V' : '56.4V'}`,
      `📍 [برنامج 27]: Float Voltage = ${battery === 'lithium' ? '53.5V' : '54.0V'}`,
      `📍 [برنامج 29]: Low Cut-off = ${battery === 'lithium' ? '44.5V' : '42.0V'}`
    ];
  } else if (brand === 'deye') {
    steps = [
      "📍 [Battery Setup]: اختر Lithium واضبط بروتوكول الـ BMS المناسب.",
      `📍 [Max Charge]: حدد تيار الشحن الأقصى بقيمة ${Math.min(120, maxAmp)}A.`,
      "📍 [System Work Mode]: تفعيل Time of Use وتحديد نسبة الـ SoC المستهدفة ليلاً.",
      "📍 [Zero Export]: فعّل خيار Limit to Load إذا كنت لا تضخ للشبكة العامة."
    ];
  } else if (brand === 'huawei') {
    steps = [
      "📍 [Quick Setup]: اختيار الـ Grid Code المحلي المطابق لبلدك.",
      "📍 [AFCI]: تفعيل الحماية من القوس الكهربائي لزيادة الأمان.",
      "📍 [Energy Storage]: ضبط mode البطارية على Max Self-Consumption."
    ];
  } else if (brand === 'growatt') {
    steps = [
      "📍 [Program 01]: اضبط الأولوية على SOL.",
      "📍 [Program 05]: اختر LI ثم رقم بروتوكول BMS للبطارية.",
      "📍 [Program 11]: حدد الشحن من الشبكة/المولد بـ 30A للحفاظ على المولد."
    ];
  }

  outDiv.innerHTML = `<b>📋 المخرجات والتوصيات:</b><br><br>` + steps.join('<br><br>');
}
</script>

</body>
</html>
