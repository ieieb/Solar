<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>حاسبة الأنظمة الشمسية الاحترافية</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #eef2f3; padding: 20px; color: #333; }
        .container { max-width: 850px; margin: auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.15); }
        h1 { text-align: center; color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #34495e; }
        input, select { width: 100%; padding: 12px; border: 1px solid #bdc3c7; border-radius: 6px; box-sizing: border-box; }
        .btn-calc { width: 100%; padding: 15px; background-color: #2980b9; color: white; border: none; border-radius: 6px; font-size: 18px; cursor: pointer; }
        .results-section { margin-top: 30px; padding: 20px; background: #fdfdfd; border-radius: 8px; border: 2px solid #2980b9; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: center; }
        th { background-color: #2c3e50; color: white; }
        .alert { background: #fff3cd; padding: 10px; border-radius: 5px; border-right: 5px solid #ffc107; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h1>حاسبة الأنظمة الشمسية المتقدمة</h1>
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <div class="form-group"><label>الحمل (Watt):</label><input type="number" id="load" value="3000"></div>
        <div class="form-group"><label>ساعات التشغيل:</label><input type="number" id="hours" value="8"></div>
        <div class="form-group"><label>فولتية النظام:</label>
            <select id="voltage"><option value="12">12V</option><option value="24">24V</option><option value="48" selected>48V</option></select>
        </div>
        <div class="form-group"><label>نوع البطارية:</label>
            <select id="battType"><option value="Lithium">ليثيوم (LiFePO4)</option><option value="Gel">جل / AGM</option></select>
        </div>
        <div class="form-group"><label>ماركة الانفرتر:</label>
            <select id="inverter-brand"><option value="Deye">Deye</option><option value="Felicity">Felicity</option><option value="Growatt">Growatt</option></select>
        </div>
    </div>

    <button class="btn-calc" onclick="calculateSystem()">حساب المكونات بدقة</button>

    <div class="results-section" id="results" style="display: none;">
        <h2>نتائج التجهيزات</h2>
        <table>
            <tr><th>المكون</th><th>النتيجة</th></tr>
            <tr><td>قاطع البطارية (DC Breaker)</td><td id="res-dc-breaker"></td></tr>
            <tr><td>قاطع التيار الخارج (AC Breaker)</td><td id="res-ac-breaker"></td></tr>
            <tr><td>سماكة كابل البطارية</td><td id="res-batt-cable"></td></tr>
            <tr><td>سعة البطاريات المطلوبة</td><td id="res-battery"></td></tr>
        </table>
        
        <div id="wiring-advice" class="alert"></div>
    </div>
</div>

<script>
    function calculateSystem() {
        let load = parseFloat(document.getElementById('load').value);
        let hours = parseFloat(document.getElementById('hours').value);
        let voltage = parseFloat(document.getElementById('voltage').value);
        let battType = document.getElementById('battType').value;
        
        // حساب التيار (Amps)
        let dcCurrent = (load / voltage) * 1.25; // معامل أمان 1.25
        let acCurrent = (load / 220) * 1.25;
        
        // حساب البطارية (عمق التفريغ يختلف)
        let dod = (battType === "Lithium") ? 0.9 : 0.5;
        let batteryAh = Math.ceil((load * hours) / (voltage * dod));

        // عرض النتائج
        document.getElementById('res-dc-breaker').innerText = Math.ceil(dcCurrent) + " أمبير";
        document.getElementById('res-ac-breaker').innerText = Math.ceil(acCurrent) + " أمبير";
        
        // تحديد سماكة الكابل (تقديري)
        let cable = (dcCurrent > 100) ? "50 mm²" : (dcCurrent > 50 ? "35 mm²" : "16 mm²");
        document.getElementById('res-batt-cable').innerText = cable;
        document.getElementById('res-battery').innerText = batteryAh + " Ah";

        // نصائح الربط
        let advice = "<strong>نصيحة الربط:</strong> ";
        if(document.getElementById('inverter-brand').value !== "متطابق") {
            advice += "بما أن الانفرتر والبطارية من ماركات مختلفة، لا تعتمد على الاتصال الذكي (BMS). اضبط وضع البطارية على <b>User-Defined</b> في إعدادات الانفرتر، وقم بضبط فولتية الشحن (Bulk Charge) على " + (battType === "Lithium" ? "56.4V" : "57.6V") + " لضمان شحن البطارية بأمان.";
        }
        document.getElementById('wiring-advice').innerHTML = advice;
        
        document.getElementById('results').style.display = "block";
    }
</script>
</body>
</html>
