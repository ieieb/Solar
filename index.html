<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة برمجة الإنفرتر الذكية</title>
    <style>
        :root {
            --primary-color: #0f172a;
            --accent-color: #1e3a8a;
            --highlight-color: #d97706;
            --bg-color: #f8fafc;
            --border-color: #cbd5e1;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: #334155;
            margin: 0;
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border-color);
        }

        h2 {
            color: var(--primary-color);
            margin-top: 0;
            border-bottom: 3px solid var(--accent-color);
            padding-bottom: 10px;
            font-size: 1.4rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: var(--primary-color);
            font-size: 0.95rem;
        }

        input[type="number"], select {
            width: 100%;
            padding: 11px;
            border: 1px solid #94a3b8;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            background-color: #fff;
        }

        input[type="number"]:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .btn-calc {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.05rem;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .btn-calc:hover {
            background-color: #1d4ed8;
        }

        .info-box {
            background-color: #f1f5f9;
            padding: 12px 15px;
            border-radius: 8px;
            border-right: 4px solid var(--accent-color);
            margin-bottom: 15px;
            font-size: 0.95rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        th {
            background-color: var(--primary-color);
            color: white;
            padding: 10px;
            text-align: right;
            font-size: 0.9rem;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.9rem;
        }

        tr:nth-child(even) {
            background-color: #f8fafc;
        }

        .setting-code {
            font-weight: bold;
            color: var(--primary-color);
        }

        .setting-val {
            font-weight: bold;
            color: var(--highlight-color);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>مولّد إعدادات الإنفرتر الذكي</h2>

    <div class="form-group">
        <label for="kwInput">أدخل قدرة الإنفرتر (بالواط W أو بالكيلوواط kW):</label>
        <input type="number" id="kwInput" step="0.1" value="" placeholder="مثال: 2.2 أو 2200 أو 3000">
    </div>

    <div class="form-group">
        <label for="batTypeSelect">نوع البطارية:</label>
        <select id="batTypeSelect">
            <option value="tubular">أنبوبية سائلة (Tubular / Flooded)</option>
            <option value="gel">جل / AGM (Gel / Sealed)</option>
            <option value="lithium">ليثيوم (LiFePO4)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="ahInput">سعة بنك البطاريات (أمبير Ah):</label>
        <input type="number" id="ahInput" value="" placeholder="مثال: 200">
    </div>

    <button class="btn-calc" onclick="autoCalculateSettings()">توليد الإعدادات تلقائياً</button>

    <div id="settingsResult"></div>
</div>

<script>
function autoCalculateSettings() {
    const kwInputVal = document.getElementById('kwInput').value;
    const ahInputVal = document.getElementById('ahInput').value;

    if (!kwInputVal || kwInputVal <= 0) {
        alert("يرجى إدخال قدرة الإنفرتر أولاً.");
        return;
    }

    let rawVal = parseFloat(kwInputVal);
    let kw = rawVal;

    // تمييز تلقائي: إذا أدخل الرقم بالآلاف (واط W) يتم تحويله فوراً إلى كيلوواط (kW)
    if (rawVal >= 50) {
        kw = rawVal / 1000;
    }

    const type = document.getElementById('batTypeSelect').value;
    const ah = parseInt(ahInputVal) || 200;

    // 1. الاكتشاف التلقائي لفولتية النظام
    let sysVolt = 24;
    if (kw <= 1.5) {
        sysVolt = 12;
    } else if (kw > 1.5 && kw <= 3.6) {
        sysVolt = 24;
    } else {
        sysVolt = 48;
    }

    // 2. حساب تيار الشحن
    let maxCharge = Math.round(ah * (type === 'lithium' ? 0.30 : 0.15));
    if (maxCharge < 10) maxCharge = 10;
    if (maxCharge > 100) maxCharge = 100;

    // 3. الفولتيات القديمة والإعدادات الثابتة
    let bulk, floatV, cutoff, backUtl, backBat;

    if (sysVolt === 12) {
        if (type === 'tubular')     { bulk = 14.4; floatV = 13.6; cutoff = 10.8; backUtl = 11.5; backBat = 13.2; }
        else if (type === 'gel')    { bulk = 14.2; floatV = 13.5; cutoff = 11.0; backUtl = 11.8; backBat = 13.0; }
        else                        { bulk = 14.2; floatV = 13.5; cutoff = 12.0; backUtl = 12.5; backBat = 13.3; }
    } else if (sysVolt === 24) {
        if (type === 'tubular')     { bulk = 28.8; floatV = 27.2; cutoff = 21.5; backUtl = 23.0; backBat = 26.5; }
        else if (type === 'gel')    { bulk = 28.4; floatV = 27.0; cutoff = 22.0; backUtl = 23.5; backBat = 26.0; }
        else                        { bulk = 28.4; floatV = 27.0; cutoff = 24.0; backUtl = 25.0; backBat = 26.8; }
    } else if (sysVolt === 48) {
        if (type === 'tubular')     { bulk = 57.6; floatV = 54.4; cutoff = 43.0; backUtl = 46.0; backBat = 53.0; }
        else if (type === 'gel')    { bulk = 56.8; floatV = 54.0; cutoff = 44.0; backUtl = 47.0; backBat = 52.0; }
        else                        { bulk = 56.8; floatV = 54.0; cutoff = 48.0; backUtl = 50.0; backBat = 53.6; }
    }

    // 4. عرض كافة النتائج
    const html = `
        <div class="info-box" style="margin-top: 20px;">
            <strong>الفولتية المكتشفة للنظام:</strong> <span style="color: #1e3a8a; font-weight: bold;">${sysVolt} Volt</span> 
            <span style="color: #64748b; font-size: 0.85em;">(القدرة: ${kw} kW)</span>
        </div>
        <table>
            <thead>
                <tr>
                    <th style="width: 15%;">الرمز</th>
                    <th style="width: 55%;">اسم الإعداد</th>
                    <th style="width: 30%;">القيمة المطلوبة</th>
                </tr>
            </thead>
            <tbody>
                <tr><td class="setting-code">01</td><td>Output Source Priority</td><td class="setting-val">SOL / SBU</td></tr>
                <tr><td class="setting-code">02</td><td>Max Charge Current</td><td class="setting-val">${maxCharge} A</td></tr>
                <tr><td class="setting-code">03</td><td>AC Input Voltage Range</td><td class="setting-val">APL</td></tr>
                <tr><td class="setting-code">05</td><td>Battery Type</td><td class="setting-val">USE</td></tr>
                <tr><td class="setting-code">06</td><td>Auto Restart Overload</td><td class="setting-val">LRE</td></tr>
                <tr><td class="setting-code">07</td><td>Auto Restart Overtemp</td><td class="setting-val">tRE</td></tr>
                <tr><td class="setting-code">09</td><td>Output Frequency</td><td class="setting-val">50 Hz</td></tr>
                <tr><td class="setting-code">11</td><td>Max Utility Charge Current</td><td class="setting-val">10 A</td></tr>
                <tr><td class="setting-code">12</td><td>Back to Utility Voltage</td><td class="setting-val">${backUtl} V</td></tr>
                <tr><td class="setting-code">13</td><td>Back to Battery Voltage</td><td class="setting-val">${backBat} V</td></tr>
                <tr><td class="setting-code">16</td><td>Charger Source Priority</td><td class="setting-val">CSO</td></tr>
                <tr><td class="setting-code">18</td><td>Alarm Control (Buzzer)</td><td class="setting-val">BON</td></tr>
                <tr><td class="setting-code">22</td><td>Backlight Control</td><td class="setting-val">LON</td></tr>
                <tr><td class="setting-code">23</td><td>Overload Bypass</td><td class="setting-val">BYE</td></tr>
                <tr><td class="setting-code">26</td><td>Bulk Charging Voltage</td><td class="setting-val">${bulk} V</td></tr>
                <tr><td class="setting-code">27</td><td>Floating Charging Voltage</td><td class="setting-val">${floatV} V</td></tr>
                <tr><td class="setting-code">29</td><td>Low Cut-off Voltage</td><td class="setting-val">${cutoff} V</td></tr>
            </tbody>
        </table>
    `;

    document.getElementById('settingsResult').innerHTML = html;
}
</script>

</body>
</html>
