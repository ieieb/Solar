<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar OS Pro | المنصة الهندسية المتكاملة للطاقة الشمسية</title>
    
    <!-- PWA Web App Meta -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0b0f19">

    <style>
        :root {
            --bg-dark: #0b0f19;
            --panel-bg: #151d2a;
            --accent-blue: #0ea5e9;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --border-color: #232f45;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            direction: rtl;
        }

        .app-header {
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .app-header h1 { margin: 0; font-size: 18px; color: var(--accent-blue); }

        .tabs-nav {
            display: flex;
            background: #101725;
            border-bottom: 1px solid var(--border-color);
            overflow-x: auto;
        }
        .tab-btn {
            padding: 14px 18px;
            background: transparent;
            border: none;
            color: var(--text-sub);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            white-space: nowrap;
        }
        .tab-btn.active {
            color: var(--accent-blue);
            border-bottom-color: var(--accent-blue);
            background: var(--panel-bg);
        }

        .main-container {
            width: 92%;
            max-width: 1200px;
            margin: 20px auto;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .card-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--accent-blue);
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .form-group { margin-bottom: 10px; }
        label { display: block; font-size: 13px; color: var(--text-sub); margin-bottom: 6px; }
        
        select, input {
            width: 100%;
            padding: 12px;
            background: #0b0f19;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        .btn-action {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }

        .simulator-box {
            background: #000;
            border: 3px solid #334155;
            border-radius: 16px;
            padding: 20px;
            max-width: 550px;
            margin: 0 auto;
        }

        .lcd-display {
            background: #041208;
            border: 2px solid #00ff88;
            border-radius: 10px;
            padding: 15px;
            color: #00ff88;
            font-family: monospace;
            min-height: 180px;
        }

        .lcd-header-bar {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dashed #00ff88;
            padding-bottom: 5px;
            font-size: 12px;
        }

        .lcd-body { margin-top: 15px; text-align: center; }
        .lcd-param-title { font-size: 13px; color: #a7f3d0; }
        .lcd-param-val { font-size: 26px; font-weight: bold; color: #fff; margin-top: 8px; }

        .keypad {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }

        .key-btn {
            background: #1e293b;
            border: 1px solid var(--accent-blue);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .table-custom {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .table-custom th, .table-custom td {
            border: 1px solid var(--border-color);
            padding: 10px;
            text-align: center;
            font-size: 13px;
        }
        .table-custom th { background: #101725; color: var(--accent-blue); }

        .badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 11px;
            background: rgba(16, 185, 129, 0.2);
            color: var(--accent-green);
        }
    </style>
</head>
<body>

<div class="app-header">
    <h1>☀️ Solar OS Pro | المنصة الهندسية المتكاملة</h1>
    <span class="badge">v3.1 Fixed</span>
</div>

<div class="tabs-nav">
    <button class="tab-btn active" onclick="switchTab(this, 'tab-calculator')">🧮 حاسبة الأحمال والنظام</button>
    <button class="tab-btn" onclick="switchTab(this, 'tab-pinout')">🔌 مصفوفة تفييش BMS</button>
    <button class="tab-btn" onclick="switchTab(this, 'tab-simulator')">🖥️ محاكي شاشة الإنفرتر 1:1</button>
</div>

<div class="main-container">

    <!-- TAB 1: حاسبة الأحمال -->
    <div id="tab-calculator" class="tab-content active">
        <div class="card">
            <div class="card-title">1. حساب أحمال المنزل والتكييف</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>إنارة وأجهزة خفيفة (Watt):</label>
                    <input type="number" id="load-light" value="500">
                </div>
                <div class="form-group">
                    <label>ثلاجات وفريزر (Watt):</label>
                    <input type="number" id="load-fridge" value="600">
                </div>
                <div class="form-group">
                    <label>مكيفات (عدد المكيفات 1.5 حصان):</label>
                    <input type="number" id="load-ac" value="1">
                </div>
                <div class="form-group">
                    <label>مضخة مياه / سخان (Watt):</label>
                    <input type="number" id="load-pump" value="1000">
                </div>
            </div>
            <button class="btn-action" onclick="calculateSystem()">حساب المواصفات الهندسية المطلوبة ⚡</button>
        </div>

        <div id="calc-results" class="card" style="display:none; border-color: var(--accent-green);">
            <div class="card-title" style="color:var(--accent-green);">التقرير الهندسي والمواصفات الموصى بها:</div>
            <div id="calc-summary-text"></div>
        </div>
    </div>

    <!-- TAB 2: مصفوفة BMS -->
    <div id="tab-pinout" class="tab-content">
        <div class="card">
            <div class="card-title">اختر الإنفرتر والبطارية بشكل مستقل:</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>ماركة الإنفرتر:</label>
                    <select id="pin-inv" onchange="updatePinoutTable()">
                        <option value="Deye">Deye Hybrid</option>
                        <option value="Growatt">Growatt SPF/SPH</option>
                        <option value="Voltronic">Voltronic Axpert / Must</option>
                        <option value="Victron">Victron Energy</option>
                        <option value="Luxpower">Luxpower SNA/LXP</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>ماركة البطارية الليثيوم:</label>
                    <select id="pin-batt" onchange="updatePinoutTable()">
                        <option value="Felicity">Felicity LiFePO4</option>
                        <option value="Pylontech">Pylontech (US3000C/US5000)</option>
                        <option value="Dyness">Dyness / Narada</option>
                        <option value="Deye-Batt">Deye Lithium</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">مخطط تفييش كابل التواصل BMS (RJ45 Cable Mapping)</div>
            <div id="pinout-matrix-container"></div>
        </div>
    </div>

    <!-- TAB 3: محاكي الشاشة -->
    <div id="tab-simulator" class="tab-content">
        <div class="card">
            <div class="card-title">محاكي شاشة الإنفرتر التفاعلي:</div>
            <div style="max-width: 300px; margin-bottom: 15px;">
                <select id="sim-inv-brand" onchange="initSimulator()">
                    <option value="Deye">Deye Touch/Menu Interface</option>
                    <option value="Growatt">Growatt SPF 3-Button Screen</option>
                    <option value="Voltronic">Voltronic Axpert LCD Menu</option>
                </select>
            </div>

            <div class="simulator-box">
                <div class="lcd-display">
                    <div class="lcd-header-bar">
                        <span id="sim-header-title">DEYE HYBRID</span>
                        <span id="sim-header-mode">MODE: MAIN</span>
                    </div>
                    <div class="lcd-body">
                        <div class="lcd-param-title" id="sim-param-title">SYSTEM STATUS</div>
                        <div class="lcd-param-val" id="sim-param-val">READY / 230V</div>
                    </div>
                </div>

                <div class="keypad">
                    <button class="key-btn" onclick="simKeyPress('ESC')">ESC</button>
                    <button class="key-btn" onclick="simKeyPress('UP')">▲ UP</button>
                    <button class="key-btn" onclick="simKeyPress('DOWN')">▼ DOWN</button>
                    <button class="key-btn" onclick="simKeyPress('ENTER')">ENTER / SET</button>
                </div>
            </div>
        </div>
    </div>

</div>

<script>
    // التنقل بين التبويبات بدون أخطاء متصفحات الموبايل
    function switchTab(btn, tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        
        let targetTab = document.getElementById(tabId);
        if (targetTab) targetTab.classList.add('active');
        if (btn) btn.classList.add('active');
    }

    // حساب النظام وإظهار المواصفات كاملة
    function calculateSystem() {
        try {
            let light = parseFloat(document.getElementById('load-light').value) || 0;
            let fridge = parseFloat(document.getElementById('load-fridge').value) || 0;
            let acCount = parseFloat(document.getElementById('load-ac').value) || 0;
            let pump = parseFloat(document.getElementById('load-pump').value) || 0;

            let totalWatts = light + fridge + (acCount * 1500) + pump;
            if (totalWatts <= 0) {
                alert("يرجى إدخال أرقام أحمال صالحة");
                return;
            }

            let totalKw = totalWatts / 1000;
            let recKw = totalKw * 1.25;
            
            let invSize = 3.6;
            if (recKw > 3.6 && recKw <= 6.0) invSize = 5.0;
            else if (recKw > 6.0 && recKw <= 9.0) invSize = 8.0;
            else if (recKw > 9.0 && recKw <= 14.0) invSize = 12.0;
            else if (recKw > 14.0) invSize = Math.ceil(recKw);

            let panelsCount = Math.ceil((totalWatts * 4.5) / 580);
            if (panelsCount < 4) panelsCount = 4;

            let battKwh = Math.max(5.0, Math.ceil((totalWatts * 6) / 1000 / 0.8));

            let dcBreaker = invSize > 6 ? "32A DC 1000V" : "20A DC 1000V";
            let battBreaker = invSize >= 8 ? "200A DC MCCB" : "125A DC MCCB";
            let battCable = invSize >= 8 ? "35mm² to 50mm²" : "25mm²";

            let html = `
                <div style="line-height: 1.8;">
                    <p><b>⚡ إجمالي الأحمال اللحظية:</b> <span style="color:var(--accent-amber); font-weight:bold;">${totalWatts} W (${totalKw.toFixed(2)} kW)</span></p>
                    <hr style="border-color:var(--border-color); margin:10px 0;">
                    
                    <p><b>🎯 قدرة الإنفرتر الموصى به:</b> <span style="color:var(--accent-blue); font-weight:bold;">${invSize} kW (48V Hybrid)</span></p>
                    <ul style="margin-top:5px; margin-bottom:15px; color:var(--text-sub);">
                        <li><b>الماركات المقترحة:</b> Deye SUN-${invSize}K-SG04 / Growatt SPF ${invSize}000T / Luxpower SNA ${invSize}000</li>
                        <li><b>قدرة الإقلاع المفاجئ (Surge Power):</b> يتحمل حتى ${invSize * 2} kW لمدة 10 ثوانٍ لتشغيل الضواغط.</li>
                    </ul>

                    <p><b>☀️ مصفوفة الألواح الشمسية:</b> <span style="color:var(--accent-green); font-weight:bold;">${panelsCount} ألواح (قدرة 580W N-Type)</span></p>
                    <ul style="margin-top:5px; margin-bottom:15px; color:var(--text-sub);">
                        <li><b>إجمالي القدرة الشمسية:</b> ${(panelsCount * 0.58).toFixed(2)} kWp</li>
                        <li><b>التوصيل (Stringing):</b> سلسلة واحدة (1 String) مكونة من ${panelsCount} ألواح توالي على مدخل MPPT1.</li>
                    </ul>

                    <p><b>🔋 بنك البطاريات المطلوب:</b> <span style="color:var(--accent-amber); font-weight:bold;">${battKwh} kWh (ليثيوم LiFePO4)</span></p>
                    <ul style="margin-top:5px; margin-bottom:15px; color:var(--text-sub);">
                        <li><b>السعة بالأمبير:</b> 1x 48V 100Ah/200Ah Pack مع نظام BMS متصل بالإنفرتر.</li>
                    </ul>

                    <p><b>🛡️ القواطع والكابلات المطلوبة:</b></p>
                    <ul style="margin-top:5px; color:var(--text-sub);">
                        <li><b>قاطع الألواح (DC Breaker):</b> ${dcBreaker}</li>
                        <li><b>قاطع البطارية (Battery Breaker):</b> ${battBreaker}</li>
                        <li><b>كابل الألواح (Solar Cable):</b> 6mm² DC Cable</li>
                        <li><b>كابل البطارية الرئيسي:</b> ${battCable} النحاسي</li>
                    </ul>
                </div>
            `;

            let resDiv = document.getElementById('calc-results');
            document.getElementById('calc-summary-text').innerHTML = html;
            resDiv.style.display = 'block';

            // التمرير التلقائي الفوري إلى شاشة النتائج
            resDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });

        } catch (err) {
            alert("حدث خطأ أثناء الحساب: " + err.message);
        }
    }

    // مصفوفة التفييش
    function updatePinoutTable() {
        let inv = document.getElementById('pin-inv').value;
        let batt = document.getElementById('pin-batt').value;

        let invPinH = "Pin 4", invPinL = "Pin 5";
        let battPinH = "Pin 4", battPinL = "Pin 5";

        if (inv === "Victron") { invPinH = "Pin 7"; invPinL = "Pin 8"; }
        if (inv === "Voltronic") { invPinH = "Pin 1 (RS485-A)"; invPinL = "Pin 2 (RS485-B)"; }
        if (batt === "Dyness") { battPinH = "Pin 2"; battPinL = "Pin 1"; }

        let html = `
            <table class="table-custom">
                <thead>
                    <tr>
                        <th>جهة الإنفرتر (${inv})</th>
                        <th>جهة البطارية (${batt})</th>
                        <th>الإشارة</th>
                        <th>لون السلك (T568B)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><b>${invPinH}</b></td>
                        <td><b>${battPinH}</b></td>
                        <td><span class="badge">CAN_H / RS485_A</span></td>
                        <td>أزرق (Blue)</td>
                    </tr>
                    <tr>
                        <td><b>${invPinL}</b></td>
                        <td><b>${battPinL}</b></td>
                        <td><span class="badge">CAN_L / RS485_B</span></td>
                        <td>أزرق/أبيض (Blue/White)</td>
                    </tr>
                </tbody>
            </table>
        `;
        document.getElementById('pinout-matrix-container').innerHTML = html;
    }

    // المحاكي
    let simState = {
        mode: 'MAIN',
        paramIndex: 0,
        params: [
            { code: 'P01: Output Priority', val: 'SUB' },
            { code: 'P05: Battery Type', val: 'LI' },
            { code: 'P36: BMS Protocol', val: 'L51' }
        ]
    };

    function initSimulator() {
        simState.mode = 'MAIN';
        updateSimDisplay();
    }

    function updateSimDisplay() {
        let brand = document.getElementById('sim-inv-brand').value;
        document.getElementById('sim-header-title').innerText = brand.toUpperCase();
        document.getElementById('sim-header-mode').innerText = "MODE: " + simState.mode;

        let p = simState.params[simState.paramIndex];
        if (simState.mode === 'MAIN') {
            document.getElementById('sim-param-title').innerText = "SYSTEM STATUS";
            document.getElementById('sim-param-val').innerText = "READY / 230V";
        } else {
            document.getElementById('sim-param-title').innerText = p.code;
            document.getElementById('sim-param-val').innerText = p.val;
        }
    }

    function simKeyPress(key) {
        if (key === 'ENTER') {
            simState.mode = (simState.mode === 'MAIN') ? 'MENU' : 'MAIN';
        } else if (key === 'UP' || key === 'DOWN') {
            if (simState.mode === 'MENU') {
                simState.paramIndex = (simState.paramIndex + 1) % simState.params.length;
            }
        }
        updateSimDisplay();
    }

    window.onload = function() {
        updatePinoutTable();
        initSimulator();
    };
</script>

</body>
</html>
