<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مصمم التابلوهات الكهربائية 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --accent-orange: #f97316;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --text-light: #f8fafc;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 15px;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid var(--accent-orange);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .header h1 { margin: 0; color: var(--accent-orange); font-size: 22px; }

        .container {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 15px;
            height: calc(100vh - 90px);
        }

        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; height: auto; }
        }

        .controls-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
        }

        .viewport-panel {
            background: #020617;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #canvas3d {
            width: 100%;
            height: 100%;
            display: block;
        }

        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; color: #cbd5e1; font-size: 13px; }
        select, input, button {
            width: 100%;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid var(--border-color);
            background: #0f172a;
            color: #fff;
            font-size: 13px;
            box-sizing: border-box;
        }

        button.btn-add {
            background: var(--accent-orange);
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            border: none;
            margin-top: 5px;
        }

        button.btn-add:hover { background: #ea580c; }
        button.btn-clear { background: #ef4444; border: none; margin-top: 5px; cursor: pointer; }

        .overlay-info {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(15, 23, 42, 0.85);
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-size: 12px;
            pointer-events: none;
        }

        .wiring-legend {
            position: absolute;
            bottom: 10px;
            right: 10px;
            left: 10px;
            background: rgba(15, 23, 42, 0.9);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--accent-blue);
            font-size: 12px;
            max-height: 100px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>مصمم التابلوهات والقطع الكهربائية 3D التفاعلي</h1>
    </div>

    <div class="container">
        <div class="controls-panel">
            <h3 style="color:var(--accent-blue); margin-top:0;">إضافة قطع للتابلوه</h3>
            
            <div class="form-group">
                <label>نوع القطعة الكهربائية:</label>
                <select id="componentType" onchange="updateRatings()">
                    <option value="mcb">قاطع مينيور (MCB Breaker)</option>
                    <option value="mccb">قاطع مجسم (MCCB Main)</option>
                    <option value="contactor">كونتاكتور تشغيل (Contactor)</option>
                    <option value="overload">أوفرلود حراري (Overload Relay)</option>
                    <option value="phase_failure">حماية فازات (Phase Failure)</option>
                    <option value="timer">تايمر تحكم (Timer Relay)</option>
                </select>
            </div>

            <div class="form-group">
                <label>سعة / أمبير القطعة:</label>
                <select id="componentRating"></select>
            </div>

            <button class="btn-add" onclick="addComponent()">+ إضافة مجسم 3D إلى التابلوه</button>
            <button class="btn-clear" onclick="clearTableau()">تفريغ التابلوه</button>

            <hr style="border-color:var(--border-color); margin:15px 0;">

            <h4 style="color:var(--accent-green); margin:0 0 10px 0;">قائمة القطع في التابلوه:</h4>
            <div id="tableauList" style="font-size:12px; color:#94a3b8;">التابلوه فارغ حالياً.</div>
        </div>

        <div class="viewport-panel">
            <div id="canvas3d"></div>
            <div class="overlay-info">
                💡 **التحكم بالتصميم:** استخدم الماوس / اللمس لتدوير التابلوه 3D وتكبيره/تصغيره.
            </div>
            <div class="wiring-legend" id="wiringGuide">
                <strong>مسار التوصيل السلكي 3D:</strong> أضف قطعاً لرؤية أسلاك التغذية (الأحمر) وأسلاك التحكم (الأزرق/الأسود).
            </div>
        </div>
    </div>
